<title>NOX TOPUP | Gaming Top Up Nepal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2322d3ee'/%3E%3Cpath d='M11 29V11h4l10 12V11h4v18h-4L15 17v12z' fill='%2307070f'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--card:#101019;--card2:#171724;--line:#262638;--cyan:#22d3ee;--violet:#8b5cf6;--text:#f4f4fb;--muted:#9a9ab0;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
button,input{font-family:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;background:rgba(7,7,15,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px;display:block}
.brand b{font-size:19px;font-weight:800;letter-spacing:.5px}
.brand b i{font-style:normal;color:var(--cyan)}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(74,222,128,.15)}
.hero{padding:48px 20px 30px;text-align:center;background:radial-gradient(ellipse 70% 80% at 50% 0,rgba(139,92,246,.28),transparent 70%)}
.hero h1{margin:0 auto 12px;max-width:640px;font-size:clamp(28px,6.5vw,46px);line-height:1.15;font-weight:800;letter-spacing:-.5px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:480px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:11px;color:#cfcfe0}
.container{max-width:980px;margin:0 auto;padding:6px 16px 20px}
.step{display:flex;align-items:center;gap:11px;margin:26px 0 14px}
.step span{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#06060c;background:linear-gradient(135deg,var(--cyan),var(--violet))}
.step h2{margin:0;font-size:17px;font-weight:700}
.step small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{position:relative;padding:10px;text-align:left;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.game:hover{border-color:#3a3a55}
.game:active{transform:scale(.97)}
.game.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 8px 28px rgba(34,211,238,.18)}
.game.active::after{content:"\2713";position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#06060c;background:var(--cyan)}
.cover{aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#1c1c28;margin-bottom:10px}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover.fit img{object-fit:contain}
.game strong{display:block;font-size:13px;font-weight:700}
.game small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.panel{margin-top:14px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.sel{margin:0 0 12px;font-size:12px;color:var(--muted)}
.packages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.package{min-width:0;padding:14px 12px;text-align:left;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s}
.package:hover{border-color:#3a3a55}
.package.active{border-color:var(--cyan);background:rgba(34,211,238,.09);box-shadow:0 0 0 1px var(--cyan)}
.package strong{display:block;font-size:15px;font-weight:700}
.package small{display:block;margin-top:2px;font-size:10px;color:var(--muted)}
.package b{display:block;margin-top:10px;font-size:14px;color:var(--cyan)}
.field{margin-top:14px}
.field:first-child{margin-top:0}
label{display:block;margin-bottom:7px;font-size:12px;color:#d2d2e2}
input[type=text],input:not([type]),input[type=file]{width:100%;padding:13px 14px;font-size:14px;color:var(--text);background:#0a0a12;border:1px solid var(--line);border-radius:11px}
input::placeholder{color:#5f5f78}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.method{padding:13px;font-size:13px;font-weight:600;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.method.active{border-color:var(--cyan);background:rgba(34,211,238,.09);box-shadow:0 0 0 1px var(--cyan)}
.pay{margin-top:12px;padding:14px;font-size:12px;line-height:1.7;color:#cfeffa;background:#0c1822;border:1px solid #1f4256;border-radius:12px;overflow-wrap:anywhere}
.pay .num{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;padding:10px 12px;font-size:15px;font-weight:700;color:#fff;background:#08111a;border-radius:10px}
.pay .num button{padding:6px 12px;font-size:11px;font-weight:600;color:var(--cyan);background:transparent;border:1px solid var(--cyan);border-radius:8px;cursor:pointer}
.qr{display:block;width:200px;max-width:100%;margin:12px auto 0;border-radius:12px;background:#fff}
.hint{margin:6px 0 0;font-size:11px;color:var(--muted)}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:14px;font-size:12px;background:var(--card2);border:1px dashed #36364f;border-radius:12px}
.total b{font-size:18px;color:var(--cyan);white-space:nowrap}
.primary{width:100%;margin-top:14px;padding:16px;font-size:14px;font-weight:800;letter-spacing:.4px;color:#06060c;background:linear-gradient(90deg,var(--cyan),#7cdcf3);border:0;border-radius:13px;cursor:pointer}
.primary:disabled,.secondary:disabled{opacity:.55;cursor:not-allowed}
.secondary{width:100%;margin-top:12px;padding:14px;font-size:13px;font-weight:600;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.copy{width:auto;display:inline-block;margin:8px 0 0;padding:8px 14px;font-size:11px}
.status{display:none;margin-top:14px;padding:13px;font-size:12px;line-height:1.7;border-radius:11px;overflow-wrap:anywhere}
.success{display:block;color:#86efac;background:#0f2a1c;border:1px solid #23643c}
.error{display:block;color:#fca5a5;background:#2e1515;border:1px solid #6e3030}
.hidden{display:none!important}
hr{border:0;border-top:1px solid var(--line);margin:20px 0 0}
footer{padding:34px 16px 44px;text-align:center;font-size:11px;color:var(--muted)}
footer .brand{justify-content:center;margin-bottom:8px}
@media(min-width:680px){.games{grid-template-columns:repeat(5,minmax(0,1fr))}.packages{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

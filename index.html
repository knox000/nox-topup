<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080810">
<title>NOX TOPUP | Gaming Top Up Nepal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#080810;--card:#12121e;--card2:#19192a;--border:#303044;--cyan:#22d3ee;--text:#f5f5ff;--muted:#9999ad}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;background:#080810ed;backdrop-filter:blur(15px)}
.logo{font-size:23px;font-weight:800;letter-spacing:1px}
.logo span{color:var(--cyan)}
.header-tag{font-size:10px;color:var(--muted)}
.hero{padding:55px 20px 35px;text-align:center;background:radial-gradient(ellipse at top,#28204c 0%,transparent 65%)}
.hero h1{font-size:clamp(30px,7vw,52px);margin:0 0 12px;font-weight:800}
.hero h1 span{color:var(--cyan)}
.hero p{color:var(--muted);font-size:13px;line-height:1.8}
.container{max-width:1000px;margin:auto;padding:20px}
.section-title{font-size:19px;margin:25px 0 15px}
.section-sub{color:var(--muted);font-size:12px;margin-top:-8px;margin-bottom:17px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.game{background:linear-gradient(145deg,#1b1b2d,#11111c);border:1px solid var(--border);border-radius:16px;padding:12px;color:var(--text);cursor:pointer;text-align:left;transition:.2s;min-height:155px;font-family:inherit;overflow:hidden}
.game:active{transform:scale(.97)}
.game.active{border:1px solid var(--cyan);background:linear-gradient(145deg,#172d3c,#17172b);box-shadow:0 0 18px #22d3ee22}
.game-icon{height:95px;width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden;background:#fff;border-radius:11px;padding:10px;color:#222;font-size:12px;font-weight:700;text-align:center}
.game-icon img{display:block;width:100%;height:100%;object-fit:contain}
.game strong{font-size:12px}
.game small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:19px;margin-top:17px}
.packages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.package{border:1px solid var(--border);border-radius:12px;padding:15px 10px;background:var(--card2);color:#fff;text-align:left;cursor:pointer;font-family:inherit;min-width:0;transition:.2s}
.package.active{border:1px solid var(--cyan);background:#153040;box-shadow:0 0 12px #22d3ee20}
.package strong{font-size:14px;display:block}
.package small{color:var(--muted);font-size:10px;display:block;margin-top:5px}

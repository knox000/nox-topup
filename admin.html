<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOX TOPUP | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080810;--card:#12121e;--card2:#191929;
  --border:#303044;--text:#f5f5ff;--muted:#9292aa;
  --cyan:#22d3ee;--purple:#9b5cff;--green:#22c55e;
  --yellow:#facc15;--red:#fb7185;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Sora,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1250px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}
.brand{font-size:23px;font-weight:800;letter-spacing:1px}
.brand span{color:var(--cyan)}
.sub{color:var(--muted);font-size:12px;margin-top:5px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;color:#080810;background:linear-gradient(100deg,var(--cyan),#8b5cf6)}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:#451b2a;color:#fecdd3;border:1px solid #713047}
.panel,.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.login{max-width:420px;margin:70px auto}
h2{font-size:19px;margin:0 0 16px}
input,select{width:100%;background:#0c0c17;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
.field{margin:13px 0}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.message{font-size:13px;color:var(--yellow);margin-top:12px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat small{color:var(--muted);font-size:12px}
.stat strong{display:block;font-size:27px;margin-top:8px}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:16px}
.order{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;margin-bottom:13px}
.order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ref{font-weight:800;color:var(--cyan);font-size:14px}
.muted{color:var(--muted);font-size:12px}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0}
.detail{background:#0c0c17;border:1px solid #252538;padding:11px;border-radius:10px;min-width:0}
.detail small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}
.detail b{font-size:13px;overflow-wrap:anywhere}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.status{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:700;background:#29293a;color:#ddd}
.status.completed,.status.paid{background:#123923;color:#86efac}
.status.processing{background:#30244b;color:#d8b4fe}
.status.pending{background:#403719;color:#fde68a}
.status.rejected,.status.failed,.status.refunded{background:#451b2a;color:#fda4af}
.screenshot{display:inline-block;color:var(--cyan);font-size:12px;margin:12px 0;text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:35px}
.hidden{display:none!important}
#preview{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
#preview img{max-width:100%;max-height:85vh;border-radius:12px}
#preview button{position:absolute;top:20px;right:20px}
@media(max-width:700px){
 .wrap{padding:14px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .tools{grid-template-columns:1fr 1fr}
 .tools input{grid-column:1/-1}
 .details{grid-template-columns:1fr 1fr}
 .controls{grid-template-columns:1fr 1fr}
 .controls button{grid-column:1/-1}
 header{align-items:flex-start}
 .brand{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
 <div>
  <div class="brand">NOX <span>TOPUP</span></div>
  <div class="sub">ADMIN CONTROL PANEL</div>
 </div>
 <button id="logoutBtn" class="btn danger hidden" onclick="logout()">Logout</button>
</header>

<section id="loginPanel" class="panel login">
 <h2>Admin Login</h2>
 <div class="field">
  <label>Email address</label>
  <input id="email" type="email" placeholder="Admin email">
 </div>
 <div class="field">
  <label>Password</label>
  <input id="password" type="password" placeholder="Password">
 </div>
 <button class="btn" style="width:100%" onclick="login()">Login to Dashboard</button>
 <div id="loginMessage" class="message"></div>
</section>

<section id="dashboard" class="hidden">
 <div class="stats">
  <div class="stat"><small>Total Orders</small><strong id="totalCount">0</strong></div>
  <div class="stat"><small>Pending</small><strong id="pendingCount">0</strong></div>
  <div class="stat"><small>Processing</small><strong id="processingCount">0</strong></div>
  <div class="stat"><small>Completed</small><strong id="completedCount">0</strong></div>
 </div>

 <div class="panel">
  <div class="order-top" style="align-items:center;margin-bottom:15px">
   <div>
    <h2 style="margin-bottom:5px">Orders Management</h2>
    <div class="muted">Review orders and update their status</div>
   </div>
   <button class="btn secondary" onclick="loadOrders()">↻ Refresh</button>
  </div>

  <div class="tools">
   <input id="search" placeholder="Search Player ID or Order Ref..." oninput="renderOrders()">
   <select id="orderFilter" onchange="renderOrders()">
    <option value="all">All order statuses</option>
    <option value="pending">Pending</option>
    <option value="processing">Processing</option>
    <option value="completed">Completed</option>
    <option value="rejected">Rejected</option>
   </select>
   <select id="paymentFilter" onchange="renderOrders()">
    <option value="all">All payment statuses</option>
    <option value="pending">Payment Pending</option>
    <option value="paid">Paid</option>
    <option value="failed">Failed</option>
    <option value="refunded">Refunded</option>
   </select>
   <button class="btn secondary" onclick="clearFilters()">Clear</button>
  </div>
  <div id="ordersList"><div class="empty">Loading orders...</div></div>
 </div>
</section>
</div>

<div id="preview" onclick="closePreview()">
 <button class="btn secondary" onclick="closePreview()">Close ✕</button>
 <img id="previewImage" alt="Payment screenshot">
</div>

<script>
const SUPABASE_URL = "https://vobhkqrrglripsluidkt.supabase.co";
const SUPABASE_KEY = "sb_publishable_v_G34s7leGxzbNmlgKOwqA_NDhMvvxV";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allOrders = [];

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function nice(value){
 return String(value || "unknown").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMessage");
 msg.textContent="Checking login...";

 if(!email || !password){
  msg.textContent="Enter your email and password.";
  return;
 }

 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){
  msg.textContent=error.message;
  return;
 }
 await checkAdmin();
}

async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();

 if(!user){
  showLogin();
  return;
 }

 const {data,error}=await db
  .from("admin_users")
  .select("user_id")
  .eq("user_id",user.id)
  .maybeSingle();

 if(error || !data){
  await db.auth.signOut();
  showLogin();
  document.getElementById("loginMessage").textContent=
   "This account is not registered as an admin.";
  return;
 }

 document.getElementById("loginPanel").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("logoutBtn").classList.remove("hidden");
 await loadOrders();
}

function showLogin(){
 document.getElementById("loginPanel").classList.remove("hidden");
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("logoutBtn").classList.add("hidden");
}

async function logout(){
 await db.auth.signOut();
 allOrders=[];
 showLogin();
 document.getElementById("loginMessage").textContent="You have logged out.";
}

async function loadOrders(){
 const list=document.getElementById("ordersList");
 list.innerHTML='<div class="empty">Loading orders...</div>';

 const {data,error}=await db
  .from("orders")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  list.innerHTML='<div class="empty">Could not load orders: '+safe(error.message)+'</div>';
  return;
 }

 allOrders=data || [];
 updateStats();
 renderOrders();
}

function updateStats(){
 document.getElementById("totalCount").textContent=allOrders.length;
 document.getElementById("pendingCount").textContent=
  allOrders.filter(o=>o.order_status==="pending").length;
 document.getElementById("processingCount").textContent=
  allOrders.filter(o=>o.order_status==="processing").length;
 document.getElementById("completedCount").textContent=
  allOrders.filter(o=>o.order_status==="completed").length;
}

function renderOrders(){
 const search=document.getElementById("search").value.trim().toLowerCase();
 const orderFilter=document.getElementById("orderFilter").value;
 const paymentFilter=document.getElementById("paymentFilter").value;

 const filtered=allOrders.filter(o=>{
  const matchesSearch=
   String(o.order_ref||"").toLowerCase().includes(search) ||
   String(o.player_id||"").toLowerCase().includes(search);
  const matchesOrder=orderFilter==="all" || o.order_status===orderFilter;
  const matchesPayment=paymentFilter==="all" || o.payment_status===paymentFilter;
  return matchesSearch && matchesOrder && matchesPayment;
 });

 const list=document.getElementById("ordersList");
 if(!filtered.length){
  list.innerHTML='<div class="empty">No orders found.</div>';
  return;
 }

 list.innerHTML=filtered.map(o=>`
  <article class="order">
   <div class="order-top">
    <div>
     <div class="ref">${safe(o.order_ref)}</div>
     <div class="muted">${safe(o.created_at ? new Date(o.created_at).toLocaleString() : "")}</div>
    </div>
    <div>
     <span class="status ${safe(o.order_status)}">${safe(nice(o.order_status))}</span>
     <span class="status ${safe(o.payment_status)}">${safe(nice(o.payment_status))}</span>
    </div>
   </div>

   <div class="details">
    <div class="detail"><small>GAME</small><b>${safe(nice(o.game))}</b></div>
    <div class="detail"><small>PLAYER ID</small><b>${safe(o.player_id)}</b></div>
    <div class="detail"><small>PACKAGE</small><b>${safe(o.package_amount)}</b></div>
    <div class="detail"><small>PRICE</small><b>NPR ${safe(o.price_npr)}</b></div>
    <div class="detail"><small>PAYMENT METHOD</small><b>${safe(nice(o.payment_method))}</b></div>
    <div class="detail"><small>PAYMENT STATUS</small><b>${safe(nice(o.payment_status))}</b></div>
   </div>

   ${o.payment_screenshot ? `
    <a class="screenshot" href="#" onclick="viewScreenshot('${safe(o.id)}');return false;">
     View payment screenshot ↗
    </a>
   ` : '<div class="muted">No payment screenshot attached.</div>'}

   <div class="controls">
    <div>
     <label>Order status</label>
     <select id="order-${safe(o.id)}">
      ${["pending","processing","completed","rejected"].map(s=>
       `<option value="${s}" ${o.order_status===s?"selected":""}>${nice(s)}</option>`
      ).join("")}
     </select>
    </div>
    <div>
     <label>Payment status</label>
     <select id="payment-${safe(o.id)}">
      ${["pending","paid","failed","refunded"].map(s=>
       `<option value="${s}" ${o.payment_status===s?"selected":""}>${nice(s)}</option>`
      ).join("")}
     </select>
    </div>
    <button class="btn" onclick="saveOrder('${safe(o.id)}')">Save Changes</button>
   </div>
  </article>
 `).join("");
}

async function saveOrder(id){
 const orderStatus=document.getElementById("order-"+id).value;
 const paymentStatus=document.getElementById("payment-"+id).value;

 const {error}=await db.from("orders").update({
  order_status:orderStatus,
  payment_status:paymentStatus
 }).eq("id",id);

 if(error){
  alert("Update failed: "+error.message);
  return;
 }

 alert("Order updated successfully.");
 await loadOrders();
}

async function viewScreenshot(id){
 const order=allOrders.find(o=>String(o.id)===String(id));
 if(!order || !order.payment_screenshot){
  alert("Screenshot not found.");
  return;
 }

 const {data,error}=await db.storage
  .from("payment-screenshots")
  .createSignedUrl(order.payment_screenshot,300);

 if(error){
  alert("Could not open screenshot: "+error.message);
  return;
 }

 document.getElementById("previewImage").src=data.signedUrl;
 document.getElementById("preview").style.display="flex";
}

function closePreview(){
 document.getElementById("preview").style.display="none";
 document.getElementById("previewImage").src="";
}

function clearFilters(){
 document.getElementById("search").value="";
 document.getElementById("orderFilter").value="all";
 document.getElementById("paymentFilter").value="all";
 renderOrders();
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT") showLogin();
});

(async()=>{
 const {data:{session}}=await db.auth.getSession();
 if(session) await checkAdmin();
})();
</script>
</body>
</html>
